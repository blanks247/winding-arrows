name: Build Android APK & Play Store AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Node Dependencies & Sync Capacitor
        run: |
          npm ci || npm install
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build Android APK (Testing)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build Android App Bundle AAB (Play Store)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Upload APK Artifact (Direct Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: WindingArrows-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB Artifact (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: WindingArrows-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
