name: Build Android APK & Play Store AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Web Dist Folder & Sync Capacitor
        run: |
          npm install
          mkdir -p dist
          cp -r index.html manifest.json sw.js package.json src dist/
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Check or Generate Permanent Release Keystore
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkey -v -keystore release.keystore -alias windingkey -keyalg RSA -keysize 2048 -validity 10000 -storepass windingpassword -keypass windingpassword -dname "CN=WindingArrows, OU=Games, O=WindingArrows, L=City, ST=State, C=US"
          fi

      - name: Build Android APK (Testing)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build & Sign Android App Bundle AAB (Play Store)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore ../release.keystore app/build/outputs/bundle/release/app-release.aab windingkey -storepass windingpassword -keypass windingpassword

      - name: Upload APK Artifact (Direct Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: WindingArrows-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed AAB Artifact (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: WindingArrows-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Backup Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindingArrows-Keystore-Backup
          path: release.keystore
